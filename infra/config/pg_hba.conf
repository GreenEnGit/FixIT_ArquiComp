# =====================================================================
# FixIT_ArquiComp — fixit_pg_master — pg_hba.conf
# SCB-1001 U2.T2.S5 — Variables de Ambiente y archivos importantes
#
# NOTA DE DISEÑO: el CIDR de la red rootless de Podman (slirp4netns /
# pasta) puede variar entre hosts y entre reinicios del servicio. Por
# ello se autoriza el origen 0.0.0.0/0 y ::0/0 confiando la seguridad
# de acceso en la autenticacion por contraseña (scram-sha-256) y en el
# control de privilegios RBAC definido en src/sql/03_roles_and_quotas.sql.
# En un despliegue expuesto a una red real, este archivo debe acotarse
# al CIDR exacto de la red fixit_dba_net (ver infra/compose.yaml).
# =====================================================================

# TYPE    DATABASE        USER            ADDRESS                 METHOD
local     all             postgres                                peer
local     all             all                                     scram-sha-256

# Streaming Replication (rol_replicacion / usuario replicator) — U5.T5.S1/S2
host      replication     replicator      0.0.0.0/0               scram-sha-256
host      replication     replicator      ::0/0                   scram-sha-256

# Acceso de aplicacion y DBA (RBAC aplicado via GRANT, no via pg_hba)
host      all             all             0.0.0.0/0               scram-sha-256
host      all             all             ::0/0                   scram-sha-256
