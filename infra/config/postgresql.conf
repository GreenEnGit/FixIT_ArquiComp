# =====================================================================
# FixIT_ArquiComp — fixit_pg_master — PostgreSQL 16.4 (postgresql.conf)
# SCB-1001 — U2.T2.S1 (memoria/procesos), U2.T2.S7 (parametros configurados),
#            U4.T4.S1 (archivos log y WAL), U5.T5.S1 (preparacion de espejeo)
# =====================================================================

# --- Conexion y red ---
listen_addresses = '*'
port = 5432
max_connections = 100

# --- Estructura de memoria de la instancia (U2.T2.S1) ---
shared_buffers = 256MB
work_mem = 16MB
maintenance_work_mem = 64MB
wal_buffers = 16MB
effective_cache_size = 768MB

# --- Modo transaccional (RF-01 / CP-01) ---
default_transaction_isolation = 'read committed'

# --- WAL y preparacion de espejeo/replica (U4.T4.S1, U5.T5.S1/S2) ---
wal_level = replica
max_wal_senders = 10
max_replication_slots = 10
hot_standby = on
wal_keep_size = 512MB
archive_mode = on
archive_command = 'test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f'
archive_timeout = 300

# --- Archivos log del SGBD (U4.T4.S1) ---
logging_collector = on
log_destination = 'csvlog'
log_directory = 'pg_log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_min_duration_statement = 500
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on

# --- Monitoreo del rendimiento (preparacion U6.T6.S1 / Practica 11) ---
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
track_io_timing = on

# --- Tablespaces ---
default_tablespace = ''
